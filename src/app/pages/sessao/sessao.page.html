<ion-content [fullscreen]="true" class="flash-content">

  <!-- HEADER -->
  <div class="top-card">

    <div class="top-info">
      <div>
        <!-- nome e descrição vêm do deckAtual buscado pelo id -->
        <h2>{{ deckAtual?.name }}</h2>
        <p>{{ deckAtual?.description }}</p>
      </div>

      <div class="avatar">
        <ion-icon name="happy-outline"></ion-icon>
      </div>
    </div>

    <ion-button class="close-btn" fill="solid" (click)="encerrarSessao()">
      Encerrar
    </ion-button>

    <!-- BARRA DE PROGRESSO -->
    <div class="progress-area">

      <div class="progress-header">
        <span>Progresso</span>
        <!-- progressoAtual já é uma porcentagem (0-100) -->
        <span>{{ progressoAtual | number:'1.0-0' }}%</span>
      </div>

      <div class="progress-bar">
        <!-- largura da barra = valor direto de progressoAtual -->
        <div class="progress-fill" [style.width.%]="progressoAtual"></div>
      </div>

    </div>

  </div>

  <!-- CONTADOR DE CARDS -->
  <div class="counter-area">

    <button class="nav-btn" (click)="anteriorCard()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <!-- indiceAtual começa em 1, cards.length é o total -->
    <span>{{ indiceAtual }}/{{ cards.length }}</span>

    <button class="nav-btn" (click)="proximoCard()">
      <ion-icon name="arrow-forward-outline"></ion-icon>
    </button>

  </div>

  <!-- CARD COM FLIP -->
  <div class="flip-container" (click)="flipCard()">

    <div class="flip-card" [class.flipped]="isFlipped">

      <!-- FRENTE: pergunta -->
      <div class="card-face card-front">
        <span class="card-label question">PERGUNTA</span>
        <h1>{{ cardAtual?.question }}</h1>
      </div>

      <!-- VERSO: resposta -->
      <div class="card-face card-back">
        <span class="card-label answer">RESPOSTA</span>
        <p>{{ cardAtual?.answer }}</p>
      </div>

    </div>

  </div>

  <p class="tip">Clique para ver o outro lado da carta!</p>

  <!-- BOTÕES: só aparecem após virar o card -->
  <div class="actions" *ngIf="isFlipped">

    <button class="action-btn success" (click)="respostaCard('certo')">
      <ion-icon name="checkmark-outline"></ion-icon>
      Acertei
    </button>

    <button class="action-btn danger" (click)="respostaCard('errado')">
      <ion-icon name="close-outline"></ion-icon>
      Errei
    </button>

  </div>

</ion-content>
