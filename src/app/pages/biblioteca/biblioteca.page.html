<!-- MENU LATERAL -->
<ion-menu
  side="start"
  menuId="main-menu"
  contentId="main-content"
>
  <ion-content>

    <div class="menu-header">
      <h2>Menu</h2>
    </div>

    <ion-list lines="none">

      <!-- SOBRE NÓS -->
      <ion-item
        button
        [routerLink]="['/sobre']"
      >
        <ion-icon
          slot="start"
          name="information-circle-outline"
        ></ion-icon>

        <ion-label>Sobre nós</ion-label>
      </ion-item>

      <!-- GITHUB -->
      <ion-item
        button
        (click)="openGithub()"
      >
        <ion-icon
          slot="start"
          name="logo-github"
        ></ion-icon>

        <ion-label>Mais</ion-label>
      </ion-item>
      
      <!-- SAIR DA CONTA -->
      <ion-item
        button
        (click)="logout()"
        class="logout-item"
      >
        <ion-icon
          slot="start"
          name="log-out-outline"
        ></ion-icon>

        <ion-label>Sair da conta</ion-label>
      </ion-item>



    </ion-list>

  </ion-content>
</ion-menu>

<!-- CONTEÚDO -->
<ion-content
  id="main-content"
  [fullscreen]="true"
  class="biblioteca-content"
>

  <!-- HEADER -->
  <div class="header">

    <h1>Biblioteca</h1>

    <div
      class="avatar"
      (click)="openMenu()"
    >
      <ion-icon name="happy-outline"></ion-icon>
    </div>

  </div>

  <!-- SEARCH -->
  <div class="search-area">

    <div class="search-box">
      <ion-icon name="search-outline"></ion-icon>

      <input
        type="text"
        placeholder="Pesquisar"
      >
    </div>

    <button class="filter-btn">
      <ion-icon name="filter-outline"></ion-icon>
    </button>

  </div>

 <!-- LOADING -->
  <div *ngIf="carregando" class="estado-info">
     <p>Carregando decks...</p>
  </div>

  <!-- LISTA VAZIA -->
  <div *ngIf="!carregando && decks.length === 0" class="estado-info">
     <p>Nenhum deck encontrado</p>
  </div>

  <!-- LISTA DE DECKS -->
  <div
    *ngFor="let deck of decks"
    class="library-card {{ corDoCard(deck.type) }}"
    (click)="abrirSessao(deck)"
  >
    <div class="stack-card stack-1"></div>
    <div class="stack-card stack-2"></div>
    <div class="stack-card stack-3"></div>
    <div class="stack-card stack-4"></div>

    <div class="card-body">

      <div class="top-row">
        <div>
          <h2>{{ deck.name }}</h2>
          <p class="subtitle">{{ deck.description }}</p>
        </div>
        <!-- corDaSenioridade() decide a classe CSS dinamicamente -->
        <span class="status {{ corDaSenioridade(deck.seniority) }}">
          {{ deck.seniority | titlecase }}
        </span>
      </div>

      <div class="tags">
        <div class="tag-item">
          <ion-icon name="document-text-outline"></ion-icon>
          <span>{{ deck.totalCards }} cards</span>
        </div>
        <!-- pill muda de cor junto com o card -->
        <span class="tag-pill {{ corDoCard(deck.type) }}-pill">
          {{ deck.type | titlecase }}
        </span>
      </div>

      <div class="progress-area">
        <div class="progress-top">
          <span>Progresso</span>
          <span>{{ deck.lastResult }}/{{ deck.totalCards }}</span>
        </div>
        <div class="progress-bar">
          <div
            class="progress {{ corDoCard(deck.type) }}-progress"
            [style.width.%]="(deck.lastResult / deck.totalCards) * 100"
          ></div>
        </div>
      </div>

    </div>
  </div>

</ion-content>
